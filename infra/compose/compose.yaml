services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets:
      - postgres_admin_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-init:
    image: pgvector/pgvector:pg16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: ${POSTGRES_SUPERUSER}
      PGPASSWORD_FILE: /run/secrets/postgres_admin_password
      TARGET_POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_RAG_USER: ${POSTGRES_RAG_USER}
      POSTGRES_REPORTING_USER: ${POSTGRES_REPORTING_USER}
    secrets:
      - postgres_admin_password
      - postgres_app_password
      - postgres_rag_password
      - postgres_reporting_password
    volumes:
      - ./postgres-init:/init:ro
    entrypoint: ["/bin/bash", "/init/init.sh"]
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_user
      - minio_root_password
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${S3_BUCKET}
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
    secrets:
      - minio_root_user
      - minio_root_password
      - s3_access_key
      - s3_secret_key
    volumes:
      - ./minio:/init:ro
    entrypoint: ["/bin/sh", "/init/init-bucket.sh"]
    restart: "no"

  dotnet-api:
    build:
      context: ../../services/dotnet-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      CUSTOMER_TIMEZONE: ${CUSTOMER_TIMEZONE}
      AI_DEFAULT_MONTHLY_BUDGET_USD: ${AI_DEFAULT_MONTHLY_BUDGET_USD}
      TECH_LOG_RETENTION_DAYS: ${TECH_LOG_RETENTION_DAYS}
      Database__RunMigrationsOnStartup: "true"
      Postgres__Host: postgres
      Postgres__Database: ${POSTGRES_DB}
      Postgres__Username: ${POSTGRES_APP_USER}
      Postgres__PasswordFile: /run/secrets/postgres_app_password
      Postgres__ReportingUsername: ${POSTGRES_REPORTING_USER}
      Postgres__ReportingPasswordFile: /run/secrets/postgres_reporting_password
      Jwt__SigningKeysFile: /run/secrets/jwt_signing_keys
      Csrf__SigningKeyFile: /run/secrets/csrf_signing_key
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS}
      InternalService__TokenFile: /run/secrets/internal_service_token
      Rag__InternalBaseUrl: http://rag-api:8000
      Viewer__DocsBaseUrl: https://docs.${PUBLIC_DOMAIN}
      S3__Endpoint: http://minio:9000
      S3__Bucket: ${S3_BUCKET}
      S3__Region: ${S3_REGION}
      S3__AccessKeyFile: /run/secrets/s3_access_key
      S3__SecretKeyFile: /run/secrets/s3_secret_key
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    secrets:
      - postgres_app_password
      - postgres_reporting_password
      - openai_api_key
      - jwt_signing_keys
      - csrf_signing_key
      - internal_service_token
      - s3_access_key
      - s3_secret_key
    volumes:
      - dotnet-logs:/var/log/dotnet-api
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  rag-api:
    build:
      context: ../../services/rag-api
    environment:
      CUSTOMER_TIMEZONE: ${CUSTOMER_TIMEZONE}
      TECH_LOG_RETENTION_DAYS: ${TECH_LOG_RETENTION_DAYS}
      RAG_DATABASE_HOST: postgres
      RAG_DATABASE_PORT: 5432
      RAG_DATABASE_NAME: ${POSTGRES_DB}
      RAG_DATABASE_USER: ${POSTGRES_RAG_USER}
      RAG_DATABASE_PASSWORD_FILE: /run/secrets/postgres_rag_password
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS}
      RAG_SEMANTIC_CACHE_TTL_HOURS: ${RAG_SEMANTIC_CACHE_TTL_HOURS}
      RAG_SEMANTIC_CACHE_SIMILARITY_THRESHOLD: ${RAG_SEMANTIC_CACHE_SIMILARITY_THRESHOLD}
      DOTNET_JWKS_URL: http://dotnet-api:8080/.well-known/jwks.json
      DOTNET_SESSION_VALIDATE_URL: http://dotnet-api:8080/internal/session/validate
      SESSION_COOKIE_NAME: __Host-session
      CSRF_SIGNING_KEY_FILE: /run/secrets/csrf_signing_key
      INTERNAL_SERVICE_TOKEN_FILE: /run/secrets/internal_service_token
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    secrets:
      - postgres_rag_password
      - openai_api_key
      - csrf_signing_key
      - internal_service_token
    volumes:
      - rag-logs:/var/log/rag-api
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5).read()\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  manage-web:
    build:
      context: ../../
      dockerfile: apps/manage-web/Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 10

  chat-web:
    build:
      context: ../../
      dockerfile: apps/chat-web/Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 10

  docs-web:
    build:
      context: ../../
      dockerfile: apps/docs-web/Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    depends_on:
      manage-web:
        condition: service_healthy
      chat-web:
        condition: service_healthy
      docs-web:
        condition: service_healthy
      dotnet-api:
        condition: service_healthy
      rag-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "caddy validate --config /etc/caddy/Caddyfile >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3

secrets:
  postgres_admin_password:
    file: ./secrets/postgres_admin_password.txt
  postgres_app_password:
    file: ./secrets/postgres_app_password.txt
  postgres_rag_password:
    file: ./secrets/postgres_rag_password.txt
  postgres_reporting_password:
    file: ./secrets/postgres_reporting_password.txt
  openai_api_key:
    file: ./secrets/openai_api_key.txt
  jwt_signing_keys:
    file: ./secrets/jwt_signing_keys.json
  csrf_signing_key:
    file: ./secrets/csrf_signing_key.txt
  internal_service_token:
    file: ./secrets/internal_service_token.txt
  minio_root_user:
    file: ./secrets/minio_root_user.txt
  minio_root_password:
    file: ./secrets/minio_root_password.txt
  s3_access_key:
    file: ./secrets/s3_access_key.txt
  s3_secret_key:
    file: ./secrets/s3_secret_key.txt

volumes:
  postgres-data:
  minio-data:
  dotnet-logs:
  rag-logs:
  caddy-data:
  caddy-config:
  caddy-logs:
