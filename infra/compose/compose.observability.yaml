# Optional observability stack: OpenTelemetry collector + Tempo (traces) +
# Prometheus (metrics) + Loki (logs) + Grafana (dashboards).
#
# Apply with:
#   docker compose -f compose.yaml -f compose.observability.yaml up -d
#
# Adds OTEL_EXPORTER_OTLP_ENDPOINT to .NET / FastAPI environments via dotenv overrides.
# The .NET / FastAPI containers must be rebuilt with OTel instrumentation packages added.
#
# See docs/v2/03-phases.md Phase 5.5.

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      # OTLP receivers (HTTP and gRPC)
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - tempo
      - loki
      - prometheus
    profiles:
      - observability

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    profiles:
      - observability

  prometheus:
    image: prom/prometheus:v3.0.1
    command:
      - --config.file=/etc/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus.yml:ro
      - prometheus-data:/prometheus
    profiles:
      - observability

  loki:
    image: grafana/loki:3.3.2
    command: -config.file=/etc/loki.yaml
    volumes:
      - ./observability/loki.yaml:/etc/loki.yaml:ro
      - loki-data:/loki
    profiles:
      - observability

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./observability/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - tempo
      - prometheus
      - loki
    profiles:
      - observability

volumes:
  tempo-data:
  prometheus-data:
  loki-data:
  grafana-data:
