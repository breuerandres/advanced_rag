# v2 overlay services: MinIO object storage and optional TEI sidecars for
# self-hosted BGE-M3 embeddings and BGE reranker.
#
# Apply with: docker compose -f compose.yaml -f compose.v2-extras.yaml up -d
#
# See docs/adr/0005-minio-object-storage.md and docs/adr/0001-multi-provider-llm.md.

services:
  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      MINIO_BROWSER_REDIRECT_URL: https://minio.${PUBLIC_DOMAIN:-localhost}
    secrets:
      - minio_root_user
      - minio_root_password
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/ready >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      BUCKET: ${MINIO_BUCKET:-helpcenter}
    secrets:
      - minio_root_user
      - minio_root_password
    volumes:
      - ./minio:/init:ro
    entrypoint: ["/bin/sh", "/init/init-bucket.sh"]
    restart: "no"

  # Optional: BGE-M3 embedding sidecar via HuggingFace Text Embeddings Inference.
  # Only start this service if tenant_config.embedding_provider = 'tei'.
  tei-embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    command:
      - --model-id
      - BAAI/bge-m3
      - --max-batch-tokens
      - "16384"
    volumes:
      - tei-embedding-cache:/data
    profiles:
      - tei
      - tei-embedding
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Optional: BGE-reranker-v2-m3 sidecar.
  # Only start when reranker_provider = 'tei-bge'.
  tei-reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    command:
      - --model-id
      - BAAI/bge-reranker-v2-m3
      - --max-batch-tokens
      - "16384"
    volumes:
      - tei-reranker-cache:/data
    profiles:
      - tei
      - tei-reranker
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  minio-data:
  tei-embedding-cache:
  tei-reranker-cache:

secrets:
  minio_root_user:
    file: ./secrets/minio_root_user.txt
  minio_root_password:
    file: ./secrets/minio_root_password.txt
