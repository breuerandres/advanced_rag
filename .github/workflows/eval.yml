name: RAG evals

on:
  pull_request:
    paths:
      - 'services/rag-api/**'
      - 'services/dotnet-api/**'
      - 'evals/**'
      - 'docs/adr/0001-multi-provider-llm.md'
      - 'docs/adr/0002-hybrid-retrieval.md'
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      docker:
        image: docker:24
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install evals dependencies
        run: pip install -r evals/requirements.txt

      - name: Spin up compose stack
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Write secret files expected by compose. Real prod uses Docker secrets;
          # CI uses ephemeral files inside the runner.
          mkdir -p infra/compose/secrets
          echo "${{ secrets.OPENAI_API_KEY }}" > infra/compose/secrets/openai_api_key.txt
          # Other secrets are generated by infra/compose/New-LocalDevSecrets.ps1 in dev;
          # CI uses placeholder values; the runner script will create them.
          bash infra/compose/ci-bootstrap-secrets.sh
          cd infra/compose
          docker compose --env-file .env.example -f compose.yaml up -d --build
          # Wait for ready
          for i in {1..60}; do
            curl -sf http://localhost:8000/health/ready && break || sleep 5
          done

      - name: Seed a tenant and an admin
        run: bash infra/compose/ci-seed-tenant.sh

      - name: Run RAGAS evals
        env:
          RAG_API_URL: http://localhost:8000
          RAG_API_TOKEN: ${{ secrets.CI_RAG_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd evals
          python ragas_runner.py --golden golden.jsonl --baseline baseline_metrics.json

      - name: Tear down compose stack
        if: always()
        run: |
          cd infra/compose
          docker compose down -v
